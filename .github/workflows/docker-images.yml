name: Build & Push microservice images

on:
  push:
    branches: [ main ]
    # Only run when microservice code/Dockerfiles (or this workflow) change
    # tags: [ 'v*.*.*' ] 
    paths:
      - 'src/utopia/microservice/**'
      - 'src/utopia/microservice/**/Dockerfile'
      - 'src/utopia/microservice/**/*.py'
      - '.github/workflows/docker-images.yml'
  workflow_dispatch:

# Prevents multiple builds from running simultaneously for the same branch. If a new push happens while a build is running, it cancels the old one
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Get changed files in this push
      - name: Changed files
        id: changes
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c
        with:
          files: |
            src/utopia/microservice/**

      # Build a dynamic matrix of only the services that changed
      - name: Compute affected services
        id: set-matrix
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.all_changed_files }}
          # DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
            python3 - <<'PY'
            import json, os, pathlib

            changed = os.environ.get("CHANGED_FILES", "").split()
            root = pathlib.Path("src/utopia/microservice")
          

            services = []
            for dockerfile in root.glob("*/Dockerfile"):
                service_dir = dockerfile.parent.as_posix()
                name = dockerfile.parent.name
                if any(f.startswith(service_dir + "/") or f == f"{service_dir}/Dockerfile" for f in changed):
                  services.append({"name": name, "context": service_dir, "dockerfile": f"{service_dir}/Dockerfile"})
            matrix={"include":services}
            with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"matrix={json.dumps(matrix)}\n")
              fh.write(f"count={len(services)}\n")
            PY

  build-and-push:
    name: Build & push (${{ matrix.name }})
    needs: detect
    if: ${{ needs.detect.outputs.count != '0' }}   # skip if nothing changed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - name: Ensure Docker Hub creds exist
        run: |
          test -n "${{ secrets.DOCKERHUB_USERNAME }}" || { echo "DOCKERHUB_USERNAME missing"; exit 1; }
          test -n "${{ secrets.DOCKERHUB_TOKEN }}" || { echo "DOCKERHUB_TOKEN missing"; exit 1; }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image name
        run: |
          IMAGE="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/$(echo '${{ matrix.name }}' | tr '[:upper:]' '[:lower:]' | tr '_' '-')"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest = false 
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
          # type=ref,event=tag
          # type=semver,pattern={{version}}
          # type=semver,pattern={{major}}.{{minor}}
          # type=semver,pattern={{major}}
  
          # type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # set platforms need multi-arch (optional)
          # platforms: linux/amd64,linux/arm64
